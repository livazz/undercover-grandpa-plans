<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Settings</title>
<style>
:root { --bg:#f6f5f1; --card:#fff; --ink:#22242a; --mute:#646873; --line:#d8d7d0; --accent:#27496d; --on-accent:#fff; --bad:#a32a22; }
@media (prefers-color-scheme: dark) { :root { --bg:#16181c; --card:#20232a; --ink:#ecedf0; --mute:#a0a4ae; --line:#373b44; --accent:#8ab4e0; --on-accent:#10151c; --bad:#f08a80; } }
* { box-sizing:border-box; }
body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:16px; background:var(--bg); color:var(--ink); font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
form { width:100%; max-width:360px; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:24px; }
h1 { font-size:20px; margin:0 0 4px; }
p { margin:0 0 16px; color:var(--mute); font-size:14px; }
input[type=password],input[type=text] { width:100%; font:inherit; padding:12px; border:1px solid var(--line); border-radius:8px; background:transparent; color:inherit; }
label { display:flex; gap:8px; align-items:center; font-size:14px; color:var(--mute); margin:12px 0 16px; }
button { width:100%; font:inherit; font-weight:600; padding:12px; border:0; border-radius:8px; background:var(--accent); color:var(--on-accent); cursor:pointer; }
button:disabled { opacity:.6; cursor:default; }
#msg { min-height:20px; margin:12px 0 0; color:var(--bad); font-size:14px; }
</style>
</head>

async function unseal(pw) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveBits']);
  const km = new Uint8Array(await crypto.subtle.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt: bytes(D.salt), iterations: D.iter }, base, 512));
  const iv = bytes(D.iv), ct = bytes(D.ct), signed = new Uint8Array(iv.length + ct.length);
  signed.set(iv); signed.set(ct, iv.length);
  const hm = await crypto.subtle.importKey('raw', km.slice(32), { name: 'HMAC', hash: 'SHA-256' }, false, ['verify']);
  if (!await crypto.subtle.verify('HMAC', hm, bytes(D.mac), signed)) return null;
  const aes = await crypto.subtle.importKey('raw', km.slice(0, 32), 'AES-CBC', false, ['decrypt']);
  return new TextDecoder().decode(await crypto.subtle.decrypt({ name: 'AES-CBC', iv }, aes, ct));

$('show').addEventListener('change', e => { $('pw').type = e.target.checked ? 'text' : 'password'; });
$('f').addEventListener('submit', async e => {
  e.preventDefault();
  $('msg').textContent = ''; $('go').disabled = true; $('go').textContent = 'Opening…';
  try {
    const html = await unseal($('pw').value.trim().toLowerCase());
    if (html === null) { $('msg').textContent = 'Wrong password.'; return; }

    $('msg').textContent = window.crypto && crypto.subtle ? "The page could not be opened." : 'This browser cannot open this page.';

    const b = document.getElementById('go');

});
